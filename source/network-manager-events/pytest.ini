# Lambda unit tests:      pytest            (from source/network-manager-events)
# Terraform tests:        see terraform/pytest.ini and `tofu test -test-directory=tests`
[pytest]
testpaths = tests
pythonpath = lambda/sns_publish_attributes tests
markers =
    aws_lambdas: test AWS lambda code
env =
    AWS_DEFAULT_REGION=eu-west-1
