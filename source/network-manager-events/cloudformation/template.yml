AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "This template installs the Network Manager Events (SO9490) as part of deploying the AWS Cloud WAN Attachment Management solution"

Parameters:
  
  EventsBusName:
    Description: "Name for the Eventbridge Bus to be used for rule configuration"
    Type: String
    Default: "default"

  Name:
    Description: "Name for the Network Manager Global Network to be created"
    Type: String

  LoggingLevel:
    Description: "Logging verbosity of the Lambda function"
    Type: String
    AllowedValues:
      - "WARN"
      - "INFO"
      - "DEBUG"
    Default: "WARN"

  LogRetentionInDays:
    Description: "Number of days to retain the Lambda function logs"
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]

Resources:
  
  SnsNetworkEvents:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "network-manager-events-${Name}"
      DisplayName: !Sub "network-manager-events-${Name}"
      KmsMasterKeyId: "alias/aws/sns"
      FifoTopic: false

  SnsNetworkEventsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: 
        - !GetAtt SnsNetworkEvents.TopicArn
      PolicyDocument:
        Statement:
          - Sid: AllowPublish
            Effect: Allow
            Principal:
              AWS:
                - !Ref AWS::AccountId
            Action: "sns:Publish"
            Resource:
              - !GetAtt SnsNetworkEvents.TopicArn
          - Sid: AllowSubscribe
            Effect: Allow
            Principal:
              AWS:
                - !Ref AWS::AccountId
            Action: "sns:Subscribe"
            Resource:
              - !GetAtt SnsNetworkEvents.TopicArn

  NetworkEventsProcessingLambdaFunctionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "network-manager-events-lambda-${Name}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: NetworkManagerEventsPublish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sns:Publish"
                Resource: !GetAtt SnsNetworkEvents.TopicArn

  NetworkEventsProcessingLambdaFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      FunctionName: !Sub "network-manager-events-${Name}"
      CodeUri: ../lambda/sns_publish_attributes
      Handler: lambda_handler.handler
      Runtime: python3.14
      Timeout: 300
      Role: !GetAtt NetworkEventsProcessingLambdaFunctionRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !GetAtt SnsNetworkEvents.TopicArn
          LOGGING_LEVEL: !Ref LoggingLevel

  NetworkEventsProcessingLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NetworkEventsProcessingLambdaFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  NetworkEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "network-manager-events-${Name}"
      EventBusName: !Ref EventsBusName
      EventPattern: 
        source:
          - "aws.networkmanager"
      Targets: 
        - Id: events-lambda
          Arn: !GetAtt NetworkEventsProcessingLambdaFunction.Arn

  NetworkEventsProcessingLambdaPermissions:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      Principal:  "events.amazonaws.com"
      SourceArn: !GetAtt NetworkEventsRule.Arn
      FunctionName: !GetAtt NetworkEventsProcessingLambdaFunction.Arn
      

Outputs:

  RegionName:
    Value: !Ref AWS::Region
  
  SnsNetworkEventsArn:
    Value: !GetAtt SnsNetworkEvents.TopicArn
  
