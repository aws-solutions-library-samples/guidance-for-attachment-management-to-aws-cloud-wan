# Terraform plan snapshot tests (require AWS credentials to run `tofu plan`):
#   pytest -m terraform                    (from this directory)
#   pytest -m terraform --snapshot-update  (regenerate after intentional changes)
[pytest]
testpaths = tests
markers =
    terraform: test Terraform / Tofu code
    order: order the tests
addopts = --snapshot-warn-unused
env =
    TF_TEST_CMD=tofu
    AWS_DEFAULT_REGION=eu-west-1
