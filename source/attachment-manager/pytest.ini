# Lambda unit tests:      pytest            (from source/attachment-manager)
# Terraform tests:        see terraform/pytest.ini and `tofu test -test-directory=tests`
[pytest]
testpaths = tests
pythonpath = lambda/attachment_manager tests
markers =
    aws_lambdas: test AWS lambda code
env =
    AWS_DEFAULT_REGION=eu-west-1
    AWS_ACCOUNT_READ_ROLE_ARN=arn:aws:iam::000000000000:role/org-reader
    LOGGING_LEVEL=INFO
