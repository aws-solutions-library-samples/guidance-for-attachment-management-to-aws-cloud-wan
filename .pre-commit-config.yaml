# See https://pre-commit.com and the "Annex A — Development tooling" section of README.md
# Install once per clone: pre-commit install   (installs both pre-commit and commit-msg hooks)
# Run on everything:     pre-commit run --all-files
# Local hooks also need OpenTofu (`tofu`) on the PATH.

default_install_hook_types: [pre-commit, commit-msg]

# Files managed by the aws-solutions-library-samples maintainers are left untouched
exclude: ^(\.github/|CODE_OF_CONDUCT\.md$|CONTRIBUTING\.md$|LICENSE$|CODEOWNERS$)

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-shebang-scripts-are-executable
  - id: check-symlinks
  - id: check-json
  - id: check-yaml
    args: [--unsafe]  # SAM / CloudFormation templates use custom tags (!Ref, !GetAtt, ...)
  - id: detect-aws-credentials
    args: ['--allow-missing-credentials']
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace

# Secrets: block tokens, private keys, etc. from being committed
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks

# Python security scan of the Lambda code (configuration in bandit.yml)
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.4
  hooks:
  - id: bandit
    args: [-c, bandit.yml]

# SAM / CloudFormation templates
- repo: https://github.com/aws-cloudformation/cfn-lint
  rev: v1.60.1
  hooks:
  - id: cfn-lint
    files: ^source/.*/cloudformation/template\.yml$

# Repository specific checks
- repo: local
  hooks:
  - id: version-is-semver
    name: VERSION is MAJOR.MINOR.PATCH
    language: pygrep
    entry: '\A\d+\.\d+\.\d+\n?\Z'
    args: [--negate, --multiline]
    files: ^VERSION$

  - id: solution-id
    name: SAM template descriptions keep the solution ID (SO9490)
    language: pygrep
    entry: 'SO9490'
    args: [--negate]
    files: ^source/.*/cloudformation/template\.yml$

  - id: snapshot-account-ids
    name: Terraform plan snapshots contain no real AWS account IDs
    language: python
    entry: python deployment/snapshot_account_ids.py --check
    files: /__snapshots__/.*\.json$

  - id: tofu-fmt
    name: OpenTofu format
    language: system
    entry: tofu fmt -check -diff -recursive source
    files: \.(tf|tftest\.hcl)$
    pass_filenames: false

# Commit message style
- repo: https://github.com/jorisroovers/gitlint
  rev: v0.19.1
  hooks:
  - id: gitlint
    stages: [commit-msg]
